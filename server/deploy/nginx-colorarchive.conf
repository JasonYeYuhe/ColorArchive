# nginx site config for api.colorarchive.org — DEPLOY TARGET:
#   /etc/nginx/sites-available/colorarchive   (symlinked into sites-enabled/)
#
# WHY THIS FILE IS IN THE REPO
# ----------------------------
# It wasn't, and that is precisely how a four-month outage went unnoticed.
#
# From 2026-04-02 to 2026-07-26 this config set `X-Real-IP` but never
# `X-Forwarded-For`. The Express app runs behind this proxy with
# `app.set("trust proxy", 1)`, which derives `req.ip` from X-Forwarded-For — so
# with the header absent, `req.ip` fell back to the socket address, which for a
# loopback proxy hop is always 127.0.0.1 / ::1. EVERY per-IP rate limit in the
# API silently collapsed into one bucket shared by the entire internet:
#
#   * POST /events + POST /pageviews  — 60/min site-wide, so one noisy caller
#     could throttle everybody. (The 1,025 429s in that window were almost all one
#     flooding address being correctly throttled, not real users losing data — an
#     earlier version of this comment claimed the latter and was wrong.)
#   * POST /auth/verify — 5 per 15 min site-wide (its key collapsed to the
#     constant "127.0.0.1:"), a one-actor login denial-of-service for all users.
#   * POST /subscribe — 10/min site-wide, sitting on the signup funnel.
#   * /ai/* — 3/day site-wide.
#
# Nothing in the codebase asserted the header, so nothing could catch it. Two
# defences now exist: this file (so the config is reviewable and versioned) and a
# boot self-check in server/index.js that logs loudly and marks /health degraded
# if a live request still resolves to loopback.
#
# SECURITY NOTE — `$proxy_add_x_forwarded_for` + `trust proxy 1` is the correct
# pairing and is NOT spoofable. A client sending `X-Forwarded-For: 1.2.3.4` gets
# it rewritten to "1.2.3.4, <real address>"; Express peels exactly one trusted
# hop off the RIGHT and lands on the real address. Never lower this to reading
# the left-most entry, and never raise `trust proxy` above 1 while nginx is the
# only proxy in front of Node — either change hands attackers a free bucket per
# request. (Verified 2026-07-26: browsers reach this host directly. There is no
# Cloudflare or Vercel hop — `next.config.ts` has no rewrites and the response
# carries no cf-ray / x-vercel-* headers — so exactly one hop is correct.)
#
# APPLY:
#   scp server/deploy/nginx-colorarchive.conf \
#       root@143.198.85.72:/etc/nginx/sites-available/colorarchive
#   ssh root@143.198.85.72 'nginx -t && systemctl reload nginx'
# `nginx -t` first, and reload rather than restart: the payment webhooks are
# served through here too.

server {
    server_name api.colorarchive.org api.colorarchive.me;

    # This is an API host. Crawlers were taking 46,481 requests per fortnight at
    # /ai/usage alone (26% of ALL API traffic — Ahrefs 13,392, Baiduspider 6,775,
    # bingbot 512), and every one of those did a SQLite read on the same
    # better-sqlite3 handle that serves the subscription lifecycle, on a 1 vCPU
    # box. There was no robots.txt at all, so nothing had ever asked them to
    # stop. Served from nginx on purpose: a crawler that only wanted robots.txt
    # never reaches Node, and never touches the database.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # THE FIX. Do not remove: without it every per-IP limit above becomes a
        # single global bucket. See the header comment.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.colorarchive.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.colorarchive.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.colorarchive.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = api.colorarchive.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.colorarchive.org api.colorarchive.me;
    return 404; # managed by Certbot
}
