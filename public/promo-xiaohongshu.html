<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: #0a0a0a; font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif; overflow: hidden; }

.container { padding: 50px 50px 40px; height: 100%; display: flex; flex-direction: column; }

.badge { display: inline-block; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 100px; padding: 10px 24px; font-size: 16px; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin-bottom: 24px; }

h1 { font-size: 64px; font-weight: 800; color: white; line-height: 1.2; margin-bottom: 14px; }
h1 .accent { background: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.subtitle { font-size: 26px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 30px; }

.palette-strip { display: flex; gap: 8px; margin-bottom: 30px; }
.palette-strip .swatch { flex: 1; height: 100px; border-radius: 16px; }

.features { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
.feature { display: flex; align-items: center; gap: 16px; }
.feature .icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.feature .text { font-size: 26px; color: rgba(255,255,255,0.8); }

.bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 16px; }
.logo-circle { width: 56px; height: 56px; border-radius: 50%; background: conic-gradient(#ef4444, #f59e0b, #22c55e, #06b6d4, #8b5cf6, #ec4899, #ef4444); }
.logo-text { font-size: 32px; font-weight: 700; color: white; }
.url { font-size: 24px; color: rgba(255,255,255,0.4); }

.color-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; margin-bottom: 30px; }
.color-grid .cell { height: 42px; border-radius: 8px; }
</style>
</head>
